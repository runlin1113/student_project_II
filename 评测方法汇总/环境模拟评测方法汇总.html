function wrap(text,n){const out=[];for(const seg of text.split("\n")){if(!seg){out.push("");continue;}let s=seg;while(s){out.push(s.slice(0,n));s=s.slice(n);}}return out;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function flowSvg(p){
  const stages=p.flow,n=stages.length,node_w=205,gap=46,pad=22;
  const W=pad*2+n*node_w+(n-1)*gap,H=372;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(p.name)}评估流程">`;
  s+=`<defs><style>.t{font:16px/1.3 'Microsoft YaHei',system-ui,sans-serif;fill:#1d2b3a}.n{font:700 15px system-ui;fill:#fff}.v{font:14px system-ui;fill:#fff}.r{font:13px system-ui;fill:#5a6b7d}</style></defs>`;
  const cx=pad,cy=10,cw=W-pad*2,ch=34;
  s+=`<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" rx="8" fill="${VERIFY}"/><text x="${cx+14}" y="${cy+22}" class="v">验证 / 奖励来源：${esc(p.verify)}</text>`;
  const y0=66,nh=150;
  for(let i=0;i<n;i++){
    const x=pad+i*(node_w+gap),last=(i===n-1),fill=last?RESULT:ACCENT;
    s+=`<rect x="${x}" y="${y0}" width="${node_w}" height="${nh}" rx="14" fill="${NODE}" stroke="${fill}" stroke-width="2.5"/>`;
    s+=`<circle cx="${x+24}" cy="${y0+26}" r="16" fill="${fill}"/><text x="${x+24}" y="${y0+32}" class="n" text-anchor="middle">${i+1}</text>`;
    let ty=y0+62;
    for(const ln of wrap(stages[i],8)){ s+=`<text x="${x+node_w/2}" y="${ty}" class="t" text-anchor="middle">${esc(ln)}</text>`; ty+=22; }
    if(!last){const ax=x+node_w+5,bx=x+node_w+gap-5; s+=`<line x1="${ax}" y1="${y0+nh/2}" x2="${bx-8}" y2="${y0+nh/2}" stroke="${LINE}" stroke-width="2.5"/><path d="M${bx-8} ${y0+nh/2-6} L${bx} ${y0+nh/2} L${bx-8} ${y0+nh/2+6} Z" fill="${LINE}"/>`;}
  }
  s+=`<text x="${pad}" y="${H-10}" class="r">↑ 末节点 = 对比基线 / 结果；其余为评测流程环节（蓝）</text></svg>`;
  return s;
}

let cur=0;
function go(i){
  cur=((i%N)+N)%N;
  slides.forEach((s,k)=>s.classList.toggle("on",k===cur));
  slides[cur].querySelectorAll(".info,.sumscroll,.svgbox").forEach(el=>el.scrollTop=0);
  [].slice.call(dots.children).forEach((b,k)=>b.classList.toggle("on",k===cur));
  prev.disabled=(cur===0); next.disabled=(cur===N-1);
  counter.textContent=(cur+1)+" / "+N+(cur===N-1?"（汇总）":"");
  document.title = cur===N-1 ? "环境模拟评测 · 汇总" : "环境模拟评测 · "+slides[cur].getAttribute("data-i");
}
prev.onclick=()=>go(cur-1); next.onclick=()=>go(cur+1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(cur-1);else if(e.key==="ArrowRight")go(cur+1);});

function mdEsc(s){return String(s).replace(/\|/g,"\\|").replace(/\n/g," ");}
function mermaidFlow(p){
  const lines=["```mermaid","flowchart LR",
    `  classDef acc fill:${ACCENT},color:#fff,stroke:#1d3a5c;`,
    `  classDef res fill:${RESULT},color:#fff,stroke:#1d5a22;`,

  lines.push(`  V["🔍 验证/奖励来源：${p.verify.replace(/"/g,"'")}"]:::ver`);
  const ids=[];
  p.flow.forEach((st,i)=>{

    const cls=i===p.flow.length-1?"res":"acc";
    const id="S"+(i+1); ids.push(id);
    lines.push(`  ${id}["${i+1}. ${lbl}"]:::${cls}`);

}
function mdPaper(p){
  const ds=p.datasets.map(([a,b,c])=>`| ${mdEsc(a)} | ${mdEsc(b)} | ${mdEsc(c.startsWith("http")?c:c)} |`).join("\n");
  return `### ${p.name} · ${p.en}\n\n`+
    `- **arXiv：** [${p.ax}](https://arxiv.org/abs/${p.ax})　|　**环境基底：** ${p.base}　|　**评测范式：** ${p.paradigm}\n`+
    `- **问题：** ${p.problem}\n- **方法：** ${p.method}\n- **验证 / 奖励来源：** ${p.verify}\n\n`+
    `**评估流程示意图**\n\n${mermaidFlow(p)}\n\n`+
    `**所用数据集**\n\n| 名称 | 内容 | 获取链接 |\n| --- | --- | --- |\n${ds}\n\n`+
    `**评估基准（指标与关键结果）**\n\n${p.result}\n\n> **← 云运维关联：** ${p.rel}\n\n`;
}
function mdCatTable(){
  let r="| 评测范式 | 论文 | 环境基底 | 验证/奖励来源 | 核心数据集 | 评测基准（摘要） |\n| --- | --- | --- | --- | --- | --- |\n";
  GROUP_ORDER.forEach((g,gi)=>{
    const [name,desc,names]=g;
    names.forEach((nm,k)=>{
      const p=byname[nm],rs=p.result,key=rs.slice(0,60)+(rs.length>60?"…":"");
      const gcell=k===0?`**${gi+1}. ${name}**<br><span>${desc}</span>`:"";
      r+=`| ${gcell} | ${p.name} / ${p.en} | ${p.base} | ${p.verify} | ${p.datasets.map(d=>d[0]).join("；")} | ${key} |\n`;
    });
  });
  return r;
}
function mdVerifTable(){
  let r="| 验证 / 奖励来源 | 论文 | 环境基底 | 评测范式 |\n| --- | --- | --- | --- |\n";
  VERIF_GROUP.forEach(([v,names])=>{
    names.forEach((nm,k)=>{const p=byname[nm];r+=`| ${k===0?v:""} | ${p.name} | ${p.base} | ${p.paradigm} |\n`;});
  });
  return r;
}
function buildMd(){
  let md="# 环境模拟评测方法汇总文档\n\n";
  md+="> 数据模拟文献调研 · “环境生成（syn / 环境合成）”类 11 篇论文的评估章节分析。\n> 逐篇提取其评估章节（网页“五问解读”之 Q4：如何证明有效性 / 用什么数据集）。\n\n";
  md+="## 范围说明\n\n网页中的“环境合成”对应分类体系的 **环境生成（syn）** 类，共 **11** 篇论文。每篇给出：① 评估流程示意图（Mermaid）；② 所用数据集（名称 / 内容 / 获取链接）；③ 评估基准（指标与关键结果）。文末附两张分类大表与项目启示。\n\n";
  md+="## 一、逐篇评估分析（11 篇）\n\n"+PAPERS.map(mdPaper).join("");
  md+="## 二、分类大表 ①：按评测范式归类\n\n“类似的进行分类”：把评估思路相近的论文归为一组，便于横向对比其评测逻辑。\n\n"+mdCatTable()+"\n";
  md+="## 三、分类大表 ②：按验证 / 奖励来源归类\n\n环境合成的可信度，几乎全部取决于“用什么来当裁判”。下表按验证 / 奖励来源分组。\n\n"+mdVerifTable()+"\n";
  md+="## 四、对“上云服务智能体”项目的启示\n\n";
  md+="1. **验证 / 奖励来源是第一位决策。** 11 篇共同经验：环境必须“真实可执行 + 状态可查”，奖励应来自状态比对或规则验证（AWM 的 SQL 比对、EnvScaler 的规则验证、FACET 的容器状态底座、InfiniteWeb 的 TCTDD），**避免用 LLM 当裁判（reward hacking）**。\n";
  md+="2. **与项目最直接同构的是 CloudEmu + AgenticGameDev。** “先生成云控制台的状态机 / 引擎，再在其上跑轨迹、轨迹自带真值”是同一技术路线的两端。\n";
  md+="3. **难度要跟着模型走。** Environment Evolution 的 off-policy 难度谱系、Agent-World 的自进化竞技场、SPADE 的可学习环境设计，都指向“环境驱动的数据飞轮”。\n";
  md+="4. **逻辑多样性方法论可迁移。** LogicEnvGen 的“同一目标下穷举环境状态 / 条件”，对应云服务的权限组合、状态先决条件、异常输入等边界情形穷举。\n\n";
  md+="---\n\n*数据来源：数据模拟文献调研 / 论文分类（树与表格）网页（环境生成 syn 类）。外部基准链接经 WebSearch 核验；各论文自身合成数据集均“随论文开源”，以对应 arXiv 编号为准。本文为评测方法汇总，非论文全文复现。*\n";
  return md;
}
document.getElementById("exportMd").onclick=function(){
  const blob=new Blob([buildMd()],{type:"text/markdown;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="环境模拟评测方法汇总.md";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
</script>
